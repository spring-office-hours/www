- episode: S5E27
  title: Hugging Face for Java Developers with Pratik Patel
  date: 2026-10-26
  guests: Pratik Patel
  abstract: >-
    Join Dan Vega and DaShaun Carter for the latest updates from the Spring Ecosystem.
    In this episode, Dan and DaShaun are joined by Java Champion Pratik Patel to talk about
    Hugging Face for Java developers. Hugging Face hosts over a million open models, but most
    Java developers have never used one. They discuss what Hugging Face actually is, how to find
    a model worth using, the ways you can run open models from Java today, and when an open model
    beats a paid API. You can participate in our live stream to ask questions or catch the replay
    on your preferred podcast platform.
  youtube: https://www.youtube.com/watch?v=7eQ3eXEI-co

